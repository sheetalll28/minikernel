[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minikernel"
version = "0.1.0"
description = "A tiny GPU kernel language, PTX compiler, and differential tester"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sheetal Lodhi" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = ["cupy-cuda12x", "numpy"]

[project.scripts]
minikernel = "minikernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
